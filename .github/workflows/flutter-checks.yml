name: Flutter checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: flutter-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: dart format --output=none lib test
      - run: flutter analyze
      - run: flutter test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: flutter build apk --debug
      - name: Install operator dependencies
        if: always()
        run: npm --prefix tools/operator ci
      - name: Run operator tests
        if: always()
        run: npm --prefix tools/operator test
      - name: Install rules test dependencies
        if: always()
        run: npm ci
      - name: Test Firestore security rules
        if: always()
        run: npm run test:rules
