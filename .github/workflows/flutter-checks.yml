name: Flutter checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: flutter-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Validate release candidate source configuration (NO-GO)
        run: node tools/release/verify_candidate.mjs --source-only --out release-preflight.json
      - run: dart format --output=none lib test
      - run: flutter analyze
      - run: flutter test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build test APK with Firebase emulators ONLY
        run: >-
          flutter build apk --debug
          --dart-define=USE_FIREBASE_EMULATOR=true
          --dart-define=FIREBASE_EMULATOR_HOST=127.0.0.1
      - name: Verify emulator-only debug APK metadata, signature and SHA-256
        run: >-
          node tools/release/verify_candidate.mjs
          --apk build/app/outputs/flutter-apk/app-debug.apk
          --out release-preflight.json
          --mode emulator-debug
          --commit-sha ${{ github.sha }}
          --run-id ${{ github.run_id }}
      - name: Save installable Android test APK
        uses: actions/upload-artifact@v4
        with:
          name: rokter-badhon-emulator-debug-apk
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            release-preflight.json
          if-no-files-found: error
          retention-days: 7


  android-smoke:
    needs: flutter
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: rokter-badhon-emulator-debug-apk
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot Android 14 emulator and smoke-test Firebase-emulator APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: bash tools/release/android_smoke.sh build/app/outputs/flutter-apk/app-debug.apk

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install operator dependencies
        run: npm --prefix tools/operator ci
      - name: Run operator tests
        run: npm --prefix tools/operator test
      - name: Install rules test dependencies
        if: always()
        run: npm ci
      - name: Test Firestore security rules
        if: always()
        run: npm run test:rules
