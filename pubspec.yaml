name: rokter_badhon
description: "রক্তের বাঁধন - Blood Donation App by Ghatail"

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # Firebase
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  cloud_firestore: ^6.2.0

  # State Management
  get: ^4.6.6

  # UI
  google_fonts: ^8.0.2
  flutter_svg: ^2.0.10
  cached_network_image: ^3.4.1

  # Utility
  intl: ^0.20.2
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
flutter:

  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

